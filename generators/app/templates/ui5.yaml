specVersion: "4.0"
metadata:
  name: <%= appId %>
type: application
framework:
  name: <%= framework %>
  version: "<%= frameworkVersion %>"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_<%= defaultTheme %><% if (viewType === "TSX") { %>
customConfiguration:
  config-ui5-tooling-transpile: &cfgTranspile
    transformJSX:
      runtime: automatic
      importSource: "ui5/community/jsx/runtime"<% } %>
builder:<% if (viewType === "TSX") { %>
  settings:
    includeDependency:
      - ui5.community.jsx.runtime<% } %>
  resources:
    excludes:
      - "test/e2e/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion<% if (viewType === "TSX") { %>
      configuration: *cfgTranspile<% } %>
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression<% if (viewType === "TSX") { %>
      configuration: *cfgTranspile<% } %>
    - name: ui5-middleware-livereload
      afterMiddleware: compression
