specVersion: "4.0"
metadata:
  name: <%= appId %>
type: application
framework:
  name: <%= framework %>
  version: "<%= frameworkVersion %>"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_<%= defaultTheme %>
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:<% if (viewType === "TSX") { %>
        transformJSX:
          runtime: automatic
          importSource: "ui5/community/jsx/runtime"<% } %>
        coverage: true
    - name: ui5-middleware-livereload
      afterMiddleware: compression
